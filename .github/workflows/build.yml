name: Build Daytona XBLA Recomp (Windows)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Apply SSSE3 Compiler Flag
      working-directory: ./project
      # Appending to CMakeLists.txt ensures the flag is applied globally 
      # without accidentally overriding the CMAKE_CXX_FLAGS set by the win-amd64 preset
      run: Add-Content -Path CMakeLists.txt -Value 'add_compile_options("-mssse3")'

    - name: Configure CMake
      run: cmake --preset win-amd64 -S project

    - name: Build
      run: cmake --build project/out/build/win-amd64 --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: daytona-windows-build
        path: |
          project/out/build/win-amd64/Release/
